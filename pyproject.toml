[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elfws"
dynamic = ["version"]
description = "EDA Log File Warning Suppressor"
readme = "README.rst"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Jeremiah C Leary", email = "jeremiah.c.leary@gmail.com" },
]
keywords = ["eda", "warning", "suppression", "logfile"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
elfws = "elfws.__main__:main"

[project.urls]
Homepage = "https://github.com/jeremiah-c-leary/eda-log-file-warning-suppressor"
Documentation = "https://eda-log-file-warning-suppressor.readthedocs.io"
Repository = "https://github.com/jeremiah-c-leary/eda-log-file-warning-suppressor"
Issues = "https://github.com/jeremiah-c-leary/eda-log-file-warning-suppressor/issues"

[tool.setuptools.dynamic]
version = { attr = "elfws.version.version" }

[tool.setuptools.packages.find]
include = ["elfws*"]
