name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install PyYAML coverage

      - name: Run unit tests with coverage
        run: coverage run -m unittest

      - name: Write coverage report
        if: matrix.python-version == '3.12'
        run: coverage xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install pyflakes==4.1.0 sdsort==1.3.1

      - name: Check for unused code and undefined names
        run: pyflakes elfws $(find tests -name '*.py' -not -path 'tests/user_defined_tools/*')

      - name: Check functions are in stepdown order
        run: sdsort --check elfws
